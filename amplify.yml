version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        # Bản web gọi API production (src/config/env.ts); đổi API bằng biến EXPO_PUBLIC_API_URL trong Amplify nếu cần
        - EXPO_PUBLIC_APP_ENV=production npx expo export --platform web
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*